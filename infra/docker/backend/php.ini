expose_php = Off
memory_limit = 256M
post_max_size = 13M
upload_max_filesize = 12M
max_file_uploads = 4
max_execution_time = 60
date.timezone = UTC
session.cookie_httponly = 1
session.cookie_samesite = Lax
zend.exception_ignore_args = On
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.jit = Off
