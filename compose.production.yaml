services:
  backend:
    build:
      target: production
    command: ["php-fpm", "--nodaemonize"]
    volumes: []
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:8080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      SESSION_COOKIE: __Host-keepproof_session
      SESSION_PATH: /
      SESSION_SAME_SITE: lax
      SESSION_SECURE_COOKIE: "true"

  queue-worker:
    build:
      target: production
    volumes: []

  scheduler:
    build:
      target: production
    volumes: []

  frontend:
    profiles: ["development-only"]

  nginx:
    image: keepproof-nginx:local
    build:
      context: .
      dockerfile: infra/docker/nginx/Dockerfile
      target: production
      args:
        NODE_VERSION: 24.18.0
    volumes: []
    depends_on: !override
      backend:
        condition: service_started
